<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <title id="pagetitle">- Galactic+</title>
    <link rel="icon" type="image/x-icon" href="staticimg/logoico.ico">
    <link href="css/main.css" rel="stylesheet" type="text/css">
    <script src="jscript/main.js"></script>
    <script type="text/javascript">
        const urlParams = new URL(window.location.toLocaleString()).searchParams;
        const v = urlParams.get('v');
        const reqURL = `${getServerAddress()}/index.json`;
        var contentIndex; 
        vidsrcfooter = './content'
        //vidsrcfooter = getServerAddress()
        function playEpisode(ep) {
            document.getElementById("pagetitle").innerHTML = `${ep.name} - Galactic+`;
            document.getElementById("vidtitle").innerHTML = `${ep.name}`;
            document.getElementById("viddesc").innerHTML = `${ep.desc}`;
            document.getElementById("vidsrc").src = `${vidsrcfooter}${ep.file}`;
        }
        fetch(reqURL) 
            .then(response => response.json())
            .then(result => {
                contentIndex = result;
                console.log(contentIndex);
                if (contentIndex[v].type == "video") {
                    playEpisode(contentIndex[v]);
                } else if (contentIndex[v].type == "show") {
                    const container = document.getElementById("episode-list");
                    
                    document.getElementById("showui").style.display = "flex";
                    episodes = contentIndex[v].episode;
                    playEpisode(contentIndex[v].episode[0]);
                    episodes.forEach(ep => {
                        const btn = document.createElement("button");
                        btn.textContent = `Episode ${ep.number}`;
                        btn.className = "episodebtn";
                        btn.onclick = () => playEpisode(contentIndex[v].episode[ep.number - 1]);
                        container.appendChild(btn);
                    });
                };
            });
    </script>
</head>
<body class="center">
    <div class="navbar">
        <a href="./new.html" class="linkico"><img src="staticimg/logopng.png" alt="Home" width="30"></a>
        <a href="./MeetTheTeam.html" class="linkbar">Credits</a>
        <a href="./licenses.html" class="linkbar">Licences</a>
    </div> 
    
    <div class="tabs">
	    <a href="./new.html" class="tab">New</a>
	    <a href="./albums.html" class="tab">Albums</a>
        <a href="./music.html" class="tab">Music</a>
	    <a href="./search.html" class="tab">Search</a>
	</div>

    <div class="centeredtabcontent">
        <div id="showui" class="showui">
            <div id="episode-list" class="eplist"></div>
            <div>
                <h1 id="vidtitle" class="vidtitle"></h1>
                <p id="viddesc"></p>
                <video id="vidsrc" src="" width="640" height="360" controls></video>
            </div>
        </div>
	</div>
</body>
</html>
