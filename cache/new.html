<!doctype html>
<html>
<head>
	<meta charset="utf-8">
	<title>Galactic+ | New</title>
	<link rel="icon" type="image/x-icon" href="staticimg/logoico.ico">
	<link href="css/main.css" rel="stylesheet" type="text/css">
	<script src="jscript/main.js"></script>
	<script>
		    const reqURL = `${getServerAddress()}/index.json`;
			var contentIndex; 
			vidsrcfooter = './content'
			//vidsrcfooter = getServerAddress()
			fetch(reqURL) 
				.then(response => response.json())
				.then(result => {
					contentIndex = result;
					console.log(contentIndex);
					const container = document.getElementById("contentList");
					Object.entries(contentIndex).forEach(([id, ep]) => {
						if (ep.type != "music") {
							const card = document.createElement("a");
							card.href = `./watch.html?v=${id}`;
							card.innerHTML = `
								<div class="card" title="Title: ${ep.name}\nDescription: ${ep.desc}">
									<img src="${vidsrcfooter}/thumb/${ep.thumbnail}" alt="placeholder" width="300" style="display:inline">
									<p class="cardtitle">${ep.name}</p>
								<div>`
							container.appendChild(card);
						}
					});
				});
	</script>
</head>
<body class="center">
    <div class="navbar">
        <a href="./new.html" class="linkico"><img src="staticimg/logopng.png" alt="Home" width="30"></a>
        <a href="./MeetTheTeam.html" class="linkbar">Credits</a>
        <a href="./licenses.html" class="linkbar">Licences</a>
    </div> 
    
    <div class="tabs">
	    <a href="./new.html" class="selectedtab">New</a>
	    <a href="./albums.html" class="tab">Albums</a>
		<a href="./music.html" class="tab">Music</a>
	    <a href="./search.html" class="tab">Search</a>
	</div>

	<div class="centeredtabcontent" id="contentList">
	</div>
</body>
</html>
